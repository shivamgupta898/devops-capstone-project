---
- name: Setup Jenkins & SonarQube Server
  hosts: jenkins
  become: yes
  tasks:
    - name: Install base tools & Java 21
      apt:
        name:
          - openjdk-21-jdk
          - maven
          - unzip
          - curl
          - git
          - ca-certificates
          - gnupg
        state: present
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Import Jenkins official public key directly via gpg recv-keys
      shell: |
        gpg --no-default-keyring --keyring /usr/share/keyrings/jenkins-keyring.gpg --keyserver keyserver.ubuntu.com --recv-keys 7198F4B714ABFC68
        chmod 644 /usr/share/keyrings/jenkins-keyring.gpg

    - name: Add Jenkins repository referencing keyring
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian-stable binary/

    - name: Update apt cache and install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Add ubuntu and jenkins users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop:
        - ubuntu
        - jenkins

    - name: Start Jenkins service
      systemd:
        name: jenkins
        state: started
        enabled: yes

    - name: Run SonarQube container
      shell: |
        if ! docker ps -a --format '{{ '{{' }} .Names {{ '}}' }}' | grep -q '^sonarqube$'; then
          docker run -d --name sonarqube -p 9000:9000 --restart always sonarqube:lts-community
        fi