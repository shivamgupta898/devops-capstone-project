apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-frontend
  labels:
    app: capstone-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-frontend
  template:
    metadata:
      labels:
        app: capstone-frontend
    spec:
      containers:
      - name: capstone-frontend
        image: shivamgupta898/capstone-frontend:20
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-frontend-service
spec:
  type: NodePort
  selector:
    app: capstone-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080